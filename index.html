<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de la persona Usuaria</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #2f24c9;
            margin: 0;
            padding: 30px;
        }

        .contenedor {
            background-color: rgb(175, 214, 221);
            max-width: 450px;
            margin: auto;
            padding: 25px;
            border-radius: 50px 15px 50px 15px;
            box-shadow: 0 0 10px #aaa;
        }

        h1 {
            text-align: center;
            color: #4c3ce0;
            font-size: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        textarea {
            resize: vertical;
            height: 90px;
        }

        .intereses label {
            font-weight: normal;
            margin-top: 8px;
        }

        button {
            width: 100%;
            background-color: #2455a4;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            margin-top: 20px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #173b78;
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <h1>Registro de la persona Usuaria</h1>

        <form action="#" method="post">

            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre"
                   placeholder="Escribe tu nombre" required>

            <label for="apellido">Apellido:</label>
            <input type="text" id="apellido" name="apellido"
                   placeholder="Escribe tu apellido" required>

            <label for="correo">Correo Electrónico:</label>
            <input type="email" id="correo" name="correo"
                   placeholder="ejemplo@correo.com" required>

            <label for="contrasena">Contraseña:</label>
            <input type="password" id="contrasena" name="contrasena"
                   placeholder="Escribe tu contraseña" required>

            <label for="descripcion">Breve descripción sobre ti:</label>
            <textarea id="descripcion" name="descripcion"
                      placeholder="Cuéntanos un poco sobre ti..."></textarea>

            <label>Selecciona tus intereses:</label>

            <div class="intereses">
                <label>
                    <input type="checkbox" name="intereses"
                           value="Tecnología">
                    Tecnología
                </label>

                <label>
                    <input type="checkbox" name="intereses"
                           value="Arte">
                    Arte
                </label>

                <label>
                    <input type="checkbox" name="intereses"
                           value="Deporte">
                    Deporte
                </label>
            </div>

            <button type="submit">Registrarse</button>

        </form>

    </div>

</body>
</html>
