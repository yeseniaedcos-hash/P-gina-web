<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculadora básica</title>

    <!-- Conexión con el archivo CSS -->
    <link rel="stylesheet" href="styles.css">

    <!-- Conexión con el archivo JavaScript -->
    <script src="script.js" defer></script>
</head>

<body>

    <main class="calculadora">

        <!-- Título -->
        <h1>Calculadora básica</h1>

        <!-- Pantalla donde aparecen los números y resultados -->
        <input
            type="text"
            id="pantalla"
            class="pantalla"
            aria-label="Pantalla de la calculadora"
            value="0"
            readonly
        >

        <!-- Botones de la calculadora -->
        <section class="teclado">

            <!-- Primera fila -->
            <button class="btn limpiar" data-action="clear">C</button>
            <button class="btn operador" data-operator="/">÷</button>
            <button class="btn operador" data-operator="*">×</button>
            <button class="btn operador" data-operator="-">−</button>

            <!-- Segunda fila -->
            <button class="btn numero" data-number="7">7</button>
            <button class="btn numero" data-number="8">8</button>
            <button class="btn numero" data-number="9">9</button>
            <button class="btn operador" data-operator="+">+</button>

            <!-- Tercera fila -->
            <button class="btn numero" data-number="4">4</button>
            <button class="btn numero" data-number="5">5</button>
            <button class="btn numero" data-number="6">6</button>
            <button class="btn igual" data-action="equals">=</button>

            <!-- Cuarta fila -->
            <button class="btn numero" data-number="1">1</button>
            <button class="btn numero" data-number="2">2</button>
            <button class="btn numero" data-number="3">3</button>

            <!-- Quinta fila -->
            <button class="btn numero cero" data-number="0">0</button>
            <button class="btn numero" data-action="decimal">.</button>

        </section>

    </main>

</body>
</html>
