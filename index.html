<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lector de Noticias</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <header>
        <h1>RADAR - Lector de Noticias</h1>
        <p>Consulta las últimas noticias</p>
    </header>

    <main>
        <section class="noticias">
            <h2>Últimas noticias</h2>

            <button id="refresh-button">
                Actualizar noticias
            </button>

            <p id="status"></p>

            <div id="news-list"></
                <!-- Aquí aparecerán las noticias -->
            </div>
        </section>
    </main>

    <footer>
        <p>Proyecto de desarrollo web - Lector de Noticias</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
